name: Modules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The core alone: nothing optional booted, and nothing that would let it stop being optional.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, zip, gd, intl
          coverage: none
      - name: Guard the publishing boundary
        run: |
          set -eu
          grep -q "if: github.repository == 'liberusoftware/project-ecommerce-laravel-filament'" .github/workflows/sync-packages.yml \
            || { echo '::error::sync-packages must run only in the canonical repository'; exit 1; }
          if [ -n "$(git ls-files 'themes/*/composer.json')" ]; then
            echo '::error::A tracked theme has a composer.json, so sync-packages would publish it'; exit 1
          fi
          if [ -n "$(git ls-files 'modules/ecommerce-*' 'modules/fixture-*' 'modules/module-manager')" ]; then
            echo '::error::Composer-installed modules must not be committed'; exit 1
          fi
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - name: Installed manifests are valid
        run: php artisan module:validate --strict
      - name: Themes are valid
        run: php artisan theme:validate
      - name: Nothing optional boots unless the deployment enables it
        run: |
          export ENABLED="$(php artisan tinker --execute 'echo implode(",", config("modules.enabled"));')"
          php artisan module:list --json | python3 -c "
          import json, os, sys
          enabled = set(filter(None, os.environ['ENABLED'].split(',')))
          booted = [m['module'] for m in json.load(sys.stdin) if m['status'] == 'booted' and m['kind'] == 'optional' and m['module'] not in enabled]
          sys.exit(f'Optional modules booted without being enabled: {booted}' if booted else 0)"

  # A real composer require, through composer-installer, into a real host.
  installed-module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fixture-supplier, package: liberusoftware/ecommerce-fixture-supplier, repository: tests/Fixtures/modules/fixture-supplier }
          - { name: ecommerce-printful, package: liberusoftware/ecommerce-printful, repository: '' }
          - { name: ecommerce-dropxl, package: liberusoftware/ecommerce-dropxl, repository: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, zip, gd, intl
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - run: .github/scripts/verify-module.sh "${{ matrix.name }}" "${{ matrix.package }}" "${{ matrix.repository }}"

  # A theme installed by Composer, built by Vite, with its own classes in the CSS.
  installed-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, zip, gd, intl
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - run: npm ci
      - run: .github/scripts/verify-theme.sh

  # SQLite accepted a CAST that MySQL refuses, and that reached a site. These are the database-sensitive paths.
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: liberu_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: liberu_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, bcmath, zip, gd, intl
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - name: Module and commerce tests on MySQL
        run: php artisan test --filter='Tests\\Feature\\(Modules|SupplierFulfilment|DispatchDropshipping|DropshippingOrderJob|CheckoutService|GraphQLCheckout|CommerceRulesParity|ProductListing|CheckoutStoreScope)'

  # The image holds every module Composer installed, including those not in the build context.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t liberu/ecommerce:modules-check .
      - name: Required modules are in the image and valid
        run: docker run --rm --entrypoint php liberu/ecommerce:modules-check /var/www/html/artisan module:validate --strict
