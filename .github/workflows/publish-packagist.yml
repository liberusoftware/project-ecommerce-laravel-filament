name: Publish application on Packagist
on:
  push:
    branches: [main]
    paths: ['composer.json', '.github/workflows/publish-packagist.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository_owner == 'liberusoftware' && !github.event.repository.private
    uses: liberusoftware/project-cms-laravel-filament/.github/workflows/publish-composer-application.yml@4804449763b5c8dfd164537060d36b4a88bca817
    secrets: inherit
