name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: pcov
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Test every source file
        run: php -d opcache.enable_cli=0 vendor/bin/phpunit --coverage-clover=coverage.xml
      - name: Require complete source coverage
        run: >-
          php -r '$metrics = simplexml_load_file("coverage.xml")->project->metrics;
          $total = (int) $metrics["statements"];
          $covered = (int) $metrics["coveredstatements"];
          if ($total === 0 || $covered !== $total) {
          fwrite(STDERR, "Expected 100% source coverage, got {$covered}/{$total}.\n"); exit(1);
          }'
